version: '3.8'

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: false

volumes:
  postgres_data:
    name: sentinelgrid_postgres_data
  prometheus_data:
    name: sentinelgrid_prometheus_data
  grafana_data:
    name: sentinelgrid_grafana_data
  kuma_data:
    name: sentinelgrid_kuma_data

services:
  # --- SentinelGrid Frontend Web Interface ---
  sentinelgrid-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelgrid-ui
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      sentinelgrid-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- SentinelGrid Core API & Monitoring Engine ---
  sentinelgrid-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelgrid-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-SentinelGridSecurePass2026}@postgres:5432/${POSTGRES_DB:-sentinelgrid}
      - JWT_SECRET=${JWT_SECRET:-sentinelgrid-production-secure-token-2026}
      - JWT_EXPIRES_IN=8h
      - PROMETHEUS_URL=http://prometheus:9090
      - GRAFANA_URL=http://grafana:3000
      - UPTIME_KUMA_URL=http://uptime-kuma:3001
      - WAZUH_API_URL=https://wazuh-manager:55000
    networks:
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

  # --- Primary Relational Store ---
  postgres:
    image: postgres:16-alpine
    container_name: sentinelgrid-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sentinel}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-SentinelGridSecurePass2026}
      - POSTGRES_DB=${POSTGRES_DB:-sentinelgrid}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinelgrid}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Prometheus Metrics Store ---
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: sentinelgrid-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - backend-net

  # --- Grafana Visualization ---
  grafana:
    image: grafana/grafana:11.1.0
    container_name: sentinelgrid-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-SentinelGrafana2026!}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - backend-net
    depends_on:
      - prometheus

  # --- Uptime Kuma Probe Engine ---
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16-alpine
    container_name: sentinelgrid-uptime-kuma
    restart: unless-stopped
    ports:
      - "3002:3001"
    volumes:
      - kuma_data:/app/data
    networks:
      - backend-net
